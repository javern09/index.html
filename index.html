<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background-color: #ffcccb;
            position: relative;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            position: relative;
        }
        .btn {
            padding: 15px 25px;
            font-size: 22px;
            margin: 20px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .yes {
            background-color: #ff4d4d;
            color: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            animation: pop 0.5s infinite alternate;
            position: absolute;
        }
        @keyframes pop {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.2);
            }
        }
        .no {
            background-color: #ffffff;
            color: #ff4d4d;
            position: absolute;
            transition: opacity 0.3s ease-in-out;
        }
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Be My Valentine? ❤️</h1>
        <button class="btn yes" id="yesButton" onclick="sayYes()">Yes</button>
        <button class="btn no" id="noButton" onclick="duplicateYes()" style="margin-left: 50px;">No</button>
    </div>
    <div class="hearts" id="hearts"></div>
    
    <script>
        function sayYes() {
            document.body.innerHTML = '<h1>Yayyyy! ❤️ Iloveyouuuuuu so much!❤️</h1>';
            createHearts();
        }

        function duplicateYes() {
            for (let i = 0; i < 3; i++) {
                let yesButton = document.getElementById('yesButton');
                let clone = yesButton.cloneNode(true);
                document.querySelector('.container').appendChild(clone);
                clone.style.left = `${Math.random() * (window.innerWidth - 200) + 100}px`;
                clone.style.top = `${Math.random() * (window.innerHeight - 200) + 100}px`;
            }
        }

        function createHearts() {
            const hearts = document.getElementById('hearts');
            for (let i = 0; i < 30; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'absolute';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * 100 + 'vh';
                heart.style.fontSize = Math.random() * 30 + 20 + 'px';
                hearts.appendChild(heart);
            }
        }
    </script>
</body>
</html>
